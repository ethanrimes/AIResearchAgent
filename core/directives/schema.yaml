type: map
required: true
mapping:
  role:
    type: str
    required: true
    description: "Defines the role or persona of the agent, including their position in the workflow."
  task:
    type: str
    required: true
    description: "Concise description of what the agent needs to accomplish."
  context:
    type: str
    required: true
    description: "Background information and context for the task."
  constraints:
    type: str
    required: true
    description: "Limitations and boundaries for the agent's actions."
  instructions:
    type: str
    required: true
    description: "Detailed step-by-step guidance for completing the task."
  output_format:
    type: str
    required: true
    description: "Specification of how the agent should structure their output, often as JSON."