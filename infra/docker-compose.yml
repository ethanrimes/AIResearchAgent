services:
  ai-agent:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
    container_name: ai-research-agent
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - LANGSMITH_TRACING=${LANGSMITH_TRACING}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - EXPERIMENT_TIMEOUT=${EXPERIMENT_TIMEOUT:-600}
      # - EXPERIMENT_RUN_PATH=${EXPERIMENT_RUN_PATH}
    volumes:
      # Core application code
      - ../core:/app/core:ro
      
      # Data directory - mount only at root
      - ../data:/data:ro
      
      # Read-only directory - mount at root
      - ../sandbox/read_only:/read_only:ro
      
      # Experiment directories
      - ${HOST_RUN_DIR}/experiment:/experiment:rw
      - ${HOST_RUN_DIR}/findings:/findings:rw
      - ${HOST_RUN_DIR}/hypothesis:/hypothesis:rw
      - ${HOST_RUN_DIR}/planning:/planning:rw
      - ${HOST_RUN_DIR}/results:/results:rw
      - ${HOST_RUN_DIR}/logs:/logs:rw
      - ${HOST_RUN_DIR}/scratchpad:/scratchpad:rw
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/log
      - /app/active_run_path:size=1k
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - openai-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    init: true
    # Using the entrypoint directly (no need for the trap command)
    entrypoint: ["/app/infra/docker/entrypoint.sh"]

networks:
  openai-network:
    driver: bridge